name: Core Upgrade Lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
  release-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 bootstrap.py --directory vendor
      - run: >
          python3 core_upgrade_lab.py run
          --baseline-dir vendor/31.1/bitcoin-31.1/bin
          --candidate-dir vendor/32.0rc3/bitcoin-32.0rc3/bin
          --provenance vendor/provenance.json
          --output output/ci
      - run: python3 core_upgrade_lab.py verify output/ci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-upgrade-evidence
          path: output/ci/
