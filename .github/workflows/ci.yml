name: Core Upgrade Lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v
  release-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 bootstrap.py --directory vendor
      - run: >
          python3 core_upgrade_lab.py run
          --baseline-dir vendor/31.1/bitcoin-31.1/bin
          --candidate-dir vendor/32.0rc3/bitcoin-32.0rc3/bin
          --provenance vendor/provenance.json
          --output output/ci
      - run: python3 core_upgrade_lab.py verify output/ci
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-upgrade-evidence
          path: output/ci/
